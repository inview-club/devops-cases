d-i debian-installer/locale string en_US
d-i keyboard-configuration/xkb-keymap select us
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string astra
d-i netcfg/get_domain string local

d-i passwd/root-login boolean false
d-i passwd/user-fullname string vagrant
d-i passwd/username string vagrant
d-i passwd/user-password password Vagrant123
d-i passwd/user-password-again password Vagrant123

d-i clock-setup/utc boolean true
d-i time/zone string Europe/Moscow

d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string openssh-server sudo
d-i grub-installer/only_debian boolean true
d-i finish-install/reboot_in_progress note

d-i apt-setup/use_mirror boolean false
d-i apt-setup/cdrom/set-first boolean false
d-i mirror/country string manual
d-i popularity-contest/participate boolean false
d-i pkgsel/update-policy select none
d-i grub-installer/bootdev string /dev/vda
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i preseed/late_command string \
  in-target sh -c 'echo "vagrant ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/vagrant; chmod 440 /etc/sudoers.d/vagrant'; \
  in-target sh -c 'grep -q "iface eth0" /etc/network/interfaces || printf "\nauto eth0\niface eth0 inet dhcp\n" >> /etc/network/interfaces'; \
  in-target systemctl enable ssh

d-i astra-license/license boolean true
d-i astra-additional-setup/additional-settings multiselect
d-i astra-additional-setup/automatic-network-disable multiselect
d-i debconf/priority string critical

d-i debian-installer/language string en
d-i debian-installer/country string US
d-i localechooser/languagelist select en
